<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Worldblock</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87CEEB;
      font-family: Arial, Helvetica, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game { width: 100%; height: 100%; display:block; touch-action:none; }
    #overlay {
      position: fixed;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.42);
      z-index:20;
      color:#fff;
      padding:max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      box-sizing:border-box;
    }
    #panel {
      width:min(620px, calc(100vw - 40px));
      padding:30px;
      background:rgba(20,20,20,.88);
      border:3px solid rgba(255,255,255,.2);
      box-shadow:0 20px 60px rgba(0,0,0,.35);
      text-align:center;
      box-sizing:border-box;
    }
    h1 { margin:0 0 10px; font-size:40px; letter-spacing:1px; }
    p { line-height:1.45; margin:8px 0; color:#e9e9e9; }
    button {
      margin-top:18px;
      padding:13px 24px;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
      background:#55a630;
      color:white;
      border:0;
      box-shadow: inset 0 -4px rgba(0,0,0,.18);
      min-height:48px;
    }
    button:disabled { cursor:wait; opacity:.6; }
    #crosshair {
      position:fixed;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:18px; height:18px;
      z-index:4;
      pointer-events:none;
    }
    #crosshair:before, #crosshair:after{
      content:"";
      position:absolute;
      background:rgba(255,255,255,.95);
      box-shadow:0 0 2px #000;
    }
    #crosshair:before{ left:8px; top:0; width:2px; height:18px; }
    #crosshair:after{ top:8px; left:0; height:2px; width:18px; }
    #hud {
      position:fixed;
      top:14px;
      left:14px;
      z-index:4;
      color:white;
      background:rgba(0,0,0,.35);
      padding:10px 12px;
      font-size:13px;
      line-height:1.45;
      text-shadow:0 1px 2px black;
      pointer-events:none;
      min-width: 230px;
    }
    #hotbar {
      position:fixed;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:6px;
      z-index:4;
      pointer-events:none;
    }
    .slot {
      width:48px;
      height:48px;
      background:rgba(40,40,40,.74);
      border:2px solid rgba(255,255,255,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:25px;
      box-sizing:border-box;
      color: white;
    }
    .slot.active { border:4px solid white; }
    #mobileNote { display:none; }

    @media (pointer: coarse), (max-width: 800px) {
      #panel {
        width:min(560px, calc(100vw - 24px));
        padding:22px 18px;
      }
      h1 { font-size:clamp(30px, 9vw, 42px); }
      #hud {
        top:max(8px, env(safe-area-inset-top));
        left:max(8px, env(safe-area-inset-left));
        min-width:0;
        padding:7px 9px;
        font-size:11px;
        line-height:1.3;
      }
      #hotbar { display:none; }
      #mobileNote { display:none; }
    }

    @media (pointer: coarse) and (orientation: portrait) {
      #panel p { font-size:14px; }
    }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="crosshair"></div>
  <div id="hud"></div>
  <div id="hotbar">
    <div class="slot active">🟩</div>
    <div class="slot">🟫</div>
    <div class="slot">⬜</div>
    <div class="slot">🪵</div>
    <div class="slot">⚔️</div>
    <div class="slot">🪢</div>
    <div class="slot">🚧</div>
  </div>
  <div id="mobileNote"></div>

  <div id="overlay">
    <div id="panel">
      <h1>WORLDBLOCK</h1>
      <p>Explora el pueblo amurallado y un mundo procedural con bosques, caballos, leones, elefantes y trolls.</p>
      <p class="desktopHelp">Teclado: WASD · Mouse para mirar · Space para saltar · E para montar.</p>
      <p class="mobileHelp">En teléfono aparecerán joystick, cámara táctil y botones de acción automáticamente.</p>
      <button id="start" disabled>CARGANDO MUNDO…</button>
    </div>
  </div>

<script type="module" src="./src/bootstrap.js"></script>
</body>
</html>
